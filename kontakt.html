<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min första webbsida</title>
  </head>
  <body>
    <header>
      <p>Välkommen till min första webbsida!</p>
      <nav>
        <ul>
          <li><a href="index.html">Hem</a></li>
          <li><a href="hobby.html">Intressen</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Kontakt</h1>
      <p>Har du frågor? Kontakta mig genom att fylla i formuläret nedanför:</p>
      <form>
        <label for="name">Namn:</label>
        <br />
        <input type="text" id="name" name="name" placeholder="Elina" required />
        <br />
        <label for="email">E-postadress:</label>
        <br />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="exempel@exempel.com"
          required
        />
        <br />
        <label for="message">Meddelande:</label>
        <br />
        <textarea
          id="message"
          name="message"
          placeholder="Jag har en fråga..."
          required
        ></textarea>
        <br />
        <label for="intresse">Gillade du webbsidan?</label>
        <label for="intresse">Ja</label>
        <input type="checkbox" id="intresse" name="intresse" value="yes" />
        <br />
        <br />
        <button type="submit">Skicka</button>
      </form>
      <br />
      <p>
        Du kan också nå mig direkt på
        <a href="mailto:elal2606@student.miun.se" target="_blank" rel="noopener"
          >E-postadress</a
        >
      </p>
    </main>
    <br />
    <footer>
      <p>© 2026 Elina Aldevärn <a href="kontakt.html">Kontakt</a></p>
    </footer>
  </body>
</html>
